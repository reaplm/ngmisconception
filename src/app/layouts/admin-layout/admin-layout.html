<!-- Application Wrapper -->
<div class="min-h-screen bg-[#f3f4fd] font-sans antialiased flex text-slate-800">

  <!-- LEFT SIDEBAR NAVIGATION PANEL -->
  <aside class="w-64 bg-white border-r border-slate-100 flex flex-col justify-between p-6 shrink-0 hidden lg:flex">
    <div>
      <!-- Brand Logo Header -->
      <div class="flex items-center gap-3 px-2 py-3 mb-6">
        <div class="h-8 w-8 bg-sky-500 rounded-lg flex items-center justify-center text-white font-bold">
          <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M12 3L1 9l11 6 9-4.91V17h2V9L12 3zM4.15 11.15l7.85 4.28 7.85-4.28L12 15.43l-7.85-4.28z"/></svg>
        </div>
        <span class="text-xl font-bold text-slate-900 tracking-tight">Misconception Detector</span>
      </div>

      <!-- Menu Section: Main Options -->
      <div class="space-y-6">
        <div>
          <span class="px-3 text-[10px] font-bold text-slate-400 uppercase tracking-widest block mb-2">Menu</span>
          <nav class="space-y-1">
            <a href="#" class="flex items-center gap-3 px-3 py-2.5 text-sm font-semibold text-slate-500 rounded-xl hover:bg-slate-50 hover:text-slate-900 transition">
              <span>Dashboard</span>
            </a>
            
            <!-- Active Exam Dropdown Menu Module -->
            <div class="space-y-1">
              <!-- Trigger Button -->
              <button 
                type="button"
                (click)="toggleExamPanel()" 
                class="w-full flex items-center justify-between px-3 py-2.5 text-sm font-bold text-sky-600 bg-sky-50 rounded-xl transition cursor-pointer">
                
                <span class="flex items-center gap-3">
                  <!-- Exam Icon Wrapper -->
                  <svg class="w-4 h-4 stroke-current fill-none" stroke-width="2" viewBox="0 0 24 24">
                    <rect x="2" y="4" width="20" height="16" rx="2" />
                    <line x1="12" y1="4" x2="12" y2="20" />
                  </svg>
                  Exam
                </span>

                <!-- Dropdown Chevron Arrow -->
                <svg 
                  [class.rotate-180]="isExamPanelOpen"
                  class="w-4 h-4 transform transition-transform duration-200 pointer-events-none" 
                  fill="none" 
                  viewBox="0 0 24 24" 
                  stroke="currentColor" 
                  stroke-width="2.5">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
                </svg>
              </button>
              
              <!-- Conditional Dropdown List Zone -->
              @if (isExamPanelOpen) {
                <div class="pl-9 space-y-1 pt-1 animate-[fadeIn_0.15s_ease-out]">
                  <a routerLink="/categories" routerLinkActive="text-slate-900 font-bold"
                    class="block px-3 py-1.5 text-xs font-bold text-slate-700 hover:text-slate-900 transition">
                    Categories
                  </a>
                  <a routerLink="/question-review" routerLinkActive="text-slate-900 font-bold"
                    class="block px-3 py-1.5 text-xs font-semibold text-slate-400 hover:text-slate-900 transition">
                    Questions
                  </a>
                  <a routerLink="/misconception" routerLinkActive="text-slate-900 font-bold"
                    class="block px-3 py-1.5 text-xs font-semibold text-slate-400 hover:text-slate-900 transition">
                    Misconceptions
                  </a>
                  <a routerLink="/exam" routerLinkActive="text-slate-900 font-bold"
                    class="block px-3 py-1.5 text-xs font-semibold text-slate-400 hover:text-slate-900 transition">
                    Preview
                  </a>
                </div>
              }
            </div> 
  
            <a href="#" class="flex items-center gap-3 px-3 py-2.5 text-sm font-semibold text-slate-500 rounded-xl hover:bg-slate-50 hover:text-slate-900 transition">
              <svg class="w-4 h-4 stroke-current fill-none" stroke-width="2" viewBox="0 0 24 24">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
              <circle cx="9" cy="7" r="4" />
              <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
              <path d="M16 3.13a4 4 0 0 1 0 7.75" />
            </svg>
              <span>Users</span>
            </a>
          </nav>
        </div>

        <!-- Menu Section: Other Options -->
        <div>
          <span class="px-3 text-[10px] font-bold text-slate-400 uppercase tracking-widest block mb-2">Other</span>
          <nav class="space-y-1">
            <a href="#" class="flex items-center gap-3 px-3 py-2.5 text-sm font-semibold text-slate-500 rounded-xl hover:bg-slate-50 hover:text-slate-900 transition">
               <svg class="w-4 h-4 stroke-current fill-none" stroke-width="2" viewBox="0 0 24 24">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                <circle cx="12" cy="7" r="4" />
              </svg>
              <span>Profile</span>
            </a>
            <a href="#" class="flex items-center gap-3 px-3 py-2.5 text-sm font-semibold text-slate-500 rounded-xl hover:bg-slate-50 hover:text-slate-900 transition">
              <svg class="w-4 h-4 stroke-current fill-none" stroke-width="2" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="3" />
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
              </svg>
              <span>Settings</span>
            </a>
          </nav>
        </div>
      </div>
    </div>

    <!-- Footer Logout Button -->
    <button class="flex items-center gap-3 px-3 py-2.5 text-sm font-semibold text-slate-400 rounded-xl hover:bg-rose-50 hover:text-rose-600 transition w-full text-left">
      <span>Log out</span>
    </button>
  </aside>

  <!-- RIGHT DATA CONTAINER AREA -->
  <div class="flex-1 flex flex-col min-w-0 overflow-y-auto max-h-screen">
    
    <!-- TOP GLOBAL NAVIGATION HEADER -->
    <header class="bg-white/40 backdrop-blur-md px-8 py-4 flex items-center justify-between gap-4 sticky top-0 z-40">
      <!-- Minimal Header Global Search Area -->
      <div class="w-full max-w-xs relative">
        <input type="text" placeholder="Search..." class="w-full pl-10 pr-4 py-2 bg-white text-sm border border-slate-200 rounded-full focus:outline-none focus:border-sky-400 focus:ring-4 focus:ring-sky-50 transition-all" />
        <svg class="w-4 h-4 stroke-slate-400 fill-none absolute left-3.5 top-1/2 transform -translate-y-1/2" stroke-width="2.5" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      </div>

      <!-- Quick Action Utilities & User Avatar Panel -->
      <div class="flex items-center gap-4">      
        <!-- User Display Frame -->
        <div class="flex items-center gap-3 pl-2 border-l border-slate-200">
          <div class="text-right hidden sm:block">
            <p class="text-xs font-bold text-slate-900 leading-tight">{{userEmail}}</p>
          </div>
        </div>
      </div>
    </header>

    <!-- DASHBOARD MAIN CANVAS GRID BODY -->
    <main class="p-8 space-y-8 flex-1">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
